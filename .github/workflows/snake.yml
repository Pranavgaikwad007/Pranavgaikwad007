
name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate white snake with black and red grid
        uses: Platane/snk@v3
        with:
          github_user_name: Pranavgaikwad007
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23FFFFFF&color_dots=%23000000,%23330000,%23660000,%23CC0000,%23FF3333

      - name: Publish animation
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
